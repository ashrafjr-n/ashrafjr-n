  <text x="92" y="271" text-anchor="middle" fill="#484F58"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8">CONTRIBUTIONS</text>

  <path d="M170,236 L170,276" stroke="#21262D" stroke-width="1"/>

  <text x="248" y="254" text-anchor="middle" fill="#FFFFFF"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="bold">45</text>
  <text x="248" y="271" text-anchor="middle" fill="#484F58"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8">LONGEST STREAK</text>

  <text x="326" y="291" text-anchor="end" fill="#30363D"
