<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B8FFF"/>
      <stop offset="100%" stop-color="#27C93F"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="339" height="299" rx="8" fill="#0D1117" stroke="#30363D"/>
  <path d="M0,8 A8,8 0 0 1 8,0 L332,0 A8,8 0 0 1 340,8 L340,36 L0,36 Z" fill="#161B22"/>
  <path d="M0,35.5 L340,35.5" stroke="#30363D" stroke-width="1"/>
  <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="18" r="6" fill="#27C93F"/>
  <text x="178" y="23" text-anchor="middle" fill="#8B949E"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">ashraf@github: ~$ ./stats.sh</text>

  <circle cx="170" cy="118" r="40" fill="none" stroke="#21262D" stroke-width="6"/>
  <circle cx="170" cy="118" r="40" fill="none" stroke="url(#ringGrad)" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 170 118)"
          stroke-dasharray="251.3" stroke-dashoffset="251.3">
    <animate attributeName="stroke-dashoffset" from="251.3" to="0"
             dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline"
             keyTimes="0;1" keySplines="0.3 0 0.2 1"/>
  </circle>
  <circle cx="170" cy="118" r="40" fill="none" stroke="#8B8FFF" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="40;54;54" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0;0" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <text x="170" y="129" text-anchor="middle" fill="#FFFFFF"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="32" font-weight="bold" opacity="0">45
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
  </text>

  <text x="170" y="184" text-anchor="middle" fill="#8B8FFF"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5">CURRENT STREAK</text>
  <text x="170" y="202" text-anchor="middle" fill="#484F58"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">days in a row</text>

  <path d="M28,222 L312,222" stroke="#21262D" stroke-width="1"/>

  <text x="92" y="254" text-anchor="middle" fill="#FFFFFF"
